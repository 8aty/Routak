name: Release

# Builds Routak.ipa, publishes it as a GitHub Release and adds it to the AltStore source,
# so AltStore offers the update.
#
# Start it from the Actions tab (Release → Run workflow), or push a tag:
#   git tag -a v1.2.0 -m "What's new" && git push origin v1.2.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.0 (must be higher than the last one)"
        required: true
      notes:
        description: "What's new (shown in AltStore)"
        required: false
        default: "Bug fixes and improvements."
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Work out version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # Checkout leaves the tag without its message; fetch the real (annotated) tag.
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            NOTES="$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME")"
          else
            VERSION="${INPUT_VERSION#v}"
            NOTES="$INPUT_NOTES"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Version must look like 1.2 or 1.2.3, got '$VERSION'"
            exit 1
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build IPA
        run: scripts/build-ipa.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}" dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/Routak.ipa \
            --title "Routak $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            --target "$GITHUB_SHA"

      - name: Add to AltStore source
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/update-source.py \
            --version "$VERSION" \
            --build "$BUILD" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/Routak.ipa" \
            --size "$(stat -f%z dist/Routak.ipa)" \
            --notes-file "$RUNNER_TEMP/notes.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          git commit -m "AltStore: Routak $VERSION"
          git push origin main
